name: tests

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Syntax sweep
        run: |
          set -e
          n=0
          for f in $(find justdraw.koplugin -name '*.lua'); do
            luajit -b "$f" /dev/null
            n=$((n + 1))
          done
          echo "LuaJIT syntax: $n files"
          test "$n" -ge 8

      - name: Run the suite
        run: |
          set -o pipefail
          luajit test.lua | tee result.txt
          grep -q '0 failed' result.txt

  # Its own job so the suite above stays fast and does not wait on an apt-get
  # of poppler. These two checks were deferred precisely because they need
  # tools the plugin's runtime does not have (ADR-31); here they get them.
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT, qpdf and poppler
        run: sudo apt-get update && sudo apt-get install -y luajit qpdf poppler-utils

      # STRICT because on a runner the tools are installed: "tool absent" here
      # means the workflow is broken, not that the machine is older.
      - name: External PDF conformance
        env:
          JUSTDRAW_PDF_EXTERNAL_STRICT: "1"
        run: luajit justdraw.koplugin/tests/pdf_external_check.lua

  # Every button and menu entry pressed on a real KOReader, through the real
  # window stack (tests/buttons_native.lua), plus the toolbars' geometry at
  # four screen profiles. Pinned: a KOReader release with the stylus API
  # (v2026.07+) and a test-data commit, so a red run means the plugin moved.
  native:
    runs-on: ubuntu-latest
    env:
      KOREADER: v2026.07.1
      TEST_DATA: c3b5d06e1ae8ea088bd898b0e7f9da3753d0d86c
    steps:
      - uses: actions/checkout@v4

      - name: Fetch KOReader and the fixtures
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/ko" "$RUNNER_TEMP/fixtures"
          curl -sSfL "https://github.com/koreader/koreader/releases/download/$KOREADER/koreader-linux-x86_64-$KOREADER.tar.xz" \
            | tar xJ -C "$RUNNER_TEMP/ko"
          for f in sample.pdf juliet.epub; do
            curl -sSfLo "$RUNNER_TEMP/fixtures/$f" \
              "https://raw.githubusercontent.com/koreader/test-data/$TEST_DATA/$f"
          done

      - name: Buttons and menus
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/ko/lib/koreader"
          SDL_VIDEODRIVER=dummy TMPDIR="$RUNNER_TEMP" \
            JUSTDRAW_PDF="$RUNNER_TEMP/fixtures/sample.pdf" \
            JUSTDRAW_EPUB="$RUNNER_TEMP/fixtures/juliet.epub" \
            ./luajit "$GITHUB_WORKSPACE/justdraw.koplugin/tests/buttons_native.lua" \
            | tee "$RUNNER_TEMP/buttons.txt" | grep -E '^(OK|FAIL|SKIP|SUMMARY|BUTTONS)|^       '
          grep -q '^BUTTONS_NATIVE_OK' "$RUNNER_TEMP/buttons.txt"

      # The floating layer against the real blitter, and the notebook
      # repository's v3 schema against the real SQLite (ADR-53..58). The query
      # plans are read with Python's sqlite3: KOReader's binding returns no rows
      # for EXPLAIN QUERY PLAN.
      - name: Floating layer and notebook repository
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/ko/lib/koreader"
          TMPDIR="$RUNNER_TEMP" ./luajit "$GITHUB_WORKSPACE/justdraw.koplugin/tests/float_layer_native.lua" "$RUNNER_TEMP" \
            | tee "$RUNNER_TEMP/float.txt"
          grep -q '^FLOAT_LAYER_NATIVE_OK' "$RUNNER_TEMP/float.txt"
          JUSTDRAW_KEEP_DB=1 TMPDIR="$RUNNER_TEMP" ./luajit "$GITHUB_WORKSPACE/justdraw.koplugin/tests/notebook_repository_native.lua" \
            | tee "$RUNNER_TEMP/repo.txt"
          grep -q '^NOTEBOOK_REPOSITORY_NATIVE_OK' "$RUNNER_TEMP/repo.txt"
          python3 "$GITHUB_WORKSPACE/justdraw.koplugin/tests/notebook_query_plans.py" \
            "$(sed -n 's/^DB //p' "$RUNNER_TEMP/repo.txt")"
          SDL_VIDEODRIVER=dummy TMPDIR="$RUNNER_TEMP" ./luajit "$GITHUB_WORKSPACE/justdraw.koplugin/tests/thumbnail_native.lua" \
            | tee "$RUNNER_TEMP/thumb.txt"
          grep -q '^THUMBNAIL_NATIVE_OK' "$RUNNER_TEMP/thumb.txt"

      - name: Toolbar geometry
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/ko/lib/koreader"
          TMPDIR="$RUNNER_TEMP" ./luajit "$GITHUB_WORKSPACE/justdraw.koplugin/tests/top_toolbar_native.lua" \
            | tee "$RUNNER_TEMP/toolbar.txt"
          grep -q '^TOP_TOOLBAR_CHECK_OK' "$RUNNER_TEMP/toolbar.txt"
